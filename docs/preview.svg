<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="tp-title tp-desc">
  <title id="tp-title">DSH Trust Platform plugin overview panel</title>
  <desc id="tp-desc">Mock of the DSH Trust Platform overview panel showing embedded-engine mode, source and authority flags, signed settlement status, six entity counters and three recent trust events.</desc>
  <rect width="640" height="300" rx="14" fill="#0d1526"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="13.5" fill="none" stroke="#233254"/>

  <!-- header: product name, mode badge, version pill -->
  <circle cx="46" cy="39" r="6" fill="#34d399"/>
  <text x="60" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#e8eefb">DSH Trust Platform</text>
  <rect x="452" y="27" width="112" height="22" rx="11" fill="#12303f" stroke="#2f6f8f"/>
  <text x="508" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#7dd3fc">embedded-engine</text>
  <rect x="570" y="27" width="50" height="22" rx="11" fill="#12261c" stroke="#2f6f4f"/>
  <text x="595" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#6ee7a8">v0.7.x</text>

  <!-- meta line -->
  <text x="46" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#93a7cc">source: embedded-engine · authoritative · health: ok · settlement: signed</text>
  <line x1="46" y1="80" x2="594" y2="80" stroke="#1d2a45"/>

  <!-- six entity counters -->
  <rect x="46" y="92" width="86" height="46" rx="8" fill="#111c31" stroke="#1e2c49"/>
  <text x="56" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" letter-spacing="0.6" fill="#7f93b8">IDENTITIES</text>
  <text x="56" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#dbe7ff">128</text>

  <rect x="140" y="92" width="86" height="46" rx="8" fill="#111c31" stroke="#1e2c49"/>
  <text x="150" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" letter-spacing="0.6" fill="#7f93b8">CREDENTIALS</text>
  <text x="150" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#dbe7ff">64</text>

  <rect x="234" y="92" width="86" height="46" rx="8" fill="#111c31" stroke="#1e2c49"/>
  <text x="244" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" letter-spacing="0.6" fill="#7f93b8">AUTHORIZ.</text>
  <text x="244" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#dbe7ff">512</text>

  <rect x="328" y="92" width="86" height="46" rx="8" fill="#111c31" stroke="#1e2c49"/>
  <text x="338" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" letter-spacing="0.6" fill="#7f93b8">TASKS</text>
  <text x="338" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#dbe7ff">23</text>

  <rect x="422" y="92" width="86" height="46" rx="8" fill="#111c31" stroke="#1e2c49"/>
  <text x="432" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" letter-spacing="0.6" fill="#7f93b8">EVENTS</text>
  <text x="432" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#dbe7ff">2,048</text>

  <rect x="516" y="92" width="86" height="46" rx="8" fill="#111c31" stroke="#1e2c49"/>
  <text x="526" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" letter-spacing="0.6" fill="#7f93b8">RECEIPTS</text>
  <text x="526" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#dbe7ff">18</text>

  <!-- recent events -->
  <text x="46" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd8f0">Recent events</text>

  <text x="46" y="190" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#9fb2d4">authorization.allowed</text>
  <rect x="330" y="179" width="56" height="16" rx="8" fill="#12261c" stroke="#2f6f4f"/>
  <text x="358" y="190.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6ee7a8">ALLOW</text>
  <text x="402" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#7f93b8">did:agent:payments-7f3a</text>
  <text x="594" y="190" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#6b7fa3">12:04:31</text>

  <text x="46" y="212" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#9fb2d4">payment.task.created</text>
  <rect x="330" y="201" width="56" height="16" rx="8" fill="#2b2412" stroke="#6b5a1f"/>
  <text x="358" y="212.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#fbbf24">DEFER</text>
  <text x="402" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#7f93b8">did:agent:treasury-2b91</text>
  <text x="594" y="212" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#6b7fa3">12:03:58</text>

  <text x="46" y="234" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#9fb2d4">risk.decision.denied</text>
  <rect x="330" y="223" width="56" height="16" rx="8" fill="#2c1216" stroke="#7f2d3a"/>
  <text x="358" y="234.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#fca5a5">DENY</text>
  <text x="402" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#7f93b8">did:agent:payments-7f3a</text>
  <text x="594" y="234" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#6b7fa3">12:02:11</text>

  <!-- footer -->
  <line x1="46" y1="250" x2="594" y2="250" stroke="#1d2a45"/>
  <text x="46" y="267" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace" font-size="9.5" fill="#6b7fa3">GET /trust-platform/api/overview · poll 5s</text>
  <text x="594" y="267" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#6b7fa3">Settings → Plugins → Data</text>
</svg>
