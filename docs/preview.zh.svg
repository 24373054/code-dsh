<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="tpzh-title tpzh-desc">
  <title id="tpzh-title">信任平台 · 代理支付工作台</title>
  <desc id="tpzh-desc">信任平台品牌横幅：实心吊桥标志与「信任运营台」字样；一句产品主张；三枚能力标签；右侧一块工作台示意卡片，显示今日关注、待我审批、本月交易额、委托链健康、待处理案件与近 7 天交易额。</desc>
  <rect width="1200" height="600" rx="24" fill="#0D0F12"/>

  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- brand row -->
    <rect x="64" y="56" width="72" height="72" rx="17" fill="#14171C" stroke="#262B33" stroke-width="1.5"/>
    <g fill="#F4F1EA" transform="translate(74, 66) scale(0.8125)">
      <rect x="7" y="44" width="50" height="3.8" rx="1.9"/>
      <rect x="18.9" y="21" width="3.8" height="23" rx="1.5"/>
      <rect x="41.3" y="21" width="3.8" height="23" rx="1.5"/>
      <path d="M7 44c4.8-1 9.4-5.8 11.8-12.2C20 28.6 21 24.6 21.2 21h2.2c-.2 3.9-1.2 7.9-2.4 11.4C18.6 39 13.4 44.2 7 44.6Z"/>
      <path d="M18.4 21c3.6 5.3 7.4 8 11.6 8s8-2.7 11.6-8l1.8 1.2c-3.8 5.9-8.2 9-13.4 9s-9.6-3.1-13.4-9Z"/>
      <path d="M57 44c-4.8-1-9.4-5.8-11.8-12.2C44 28.6 43 24.6 42.8 21h-2.2c.2 3.9 1.2 7.9 2.4 11.4C45.4 39 50.6 44.2 57 44.6Z"/>
    </g>
    <text x="158" y="93" font-size="28" font-weight="700" fill="#F4F1EA" letter-spacing="0.5">信任运营台</text>
    <text x="159" y="118" font-size="10" font-weight="600" fill="#8B93A1" letter-spacing="3.4">TRUST OPERATIONS CONSOLE</text>

    <!-- claim -->
    <text x="64" y="222" font-size="35" font-weight="700" fill="#F4F1EA" letter-spacing="0.4">让每个 AI 代理在边界内工作</text>
    <text x="64" y="262" font-size="15" fill="#A7AEBB">为每个代理设定额度与审批边界，它在边界内自动执行；</text>
    <text x="64" y="290" font-size="15" fill="#A7AEBB">只有超出边界的事情，才交到你手上。</text>

    <!-- capability chips -->
    <g font-size="11.5" fill="#C7CDD6">
      <rect x="64" y="338" width="156" height="34" rx="17" fill="#14171C" stroke="#262B33"/>
      <circle cx="84" cy="355" r="3.5" fill="#5BE6AC"/>
      <text x="96" y="359">委托链 · 逐级收紧</text>
      <rect x="232" y="338" width="190" height="34" rx="17" fill="#14171C" stroke="#262B33"/>
      <circle cx="252" cy="355" r="3.5" fill="#5BE6AC"/>
      <text x="264" y="359">风险决策 · 只处理例外</text>
      <rect x="434" y="338" width="170" height="34" rx="17" fill="#14171C" stroke="#262B33"/>
      <circle cx="454" cy="355" r="3.5" fill="#5BE6AC"/>
      <text x="466" y="359">结算凭据 · 全程留痕</text>
    </g>

    <!-- footer -->
    <text x="64" y="520" font-size="11.5" fill="#6F7784">本地工作区 · 数据仅保存在本机 · 结算已验证</text>
    <text x="1136" y="520" font-size="11" fill="#8B93A1" text-anchor="end">v0.9.2</text>

    <!-- product card -->
    <rect x="690" y="110" width="450" height="384" rx="18" fill="#14171C" stroke="#262B33" stroke-width="1.5"/>
    <text x="714" y="148" font-size="13" font-weight="700" fill="#F4F1EA">今天需要你关注的事情</text>
    <text x="714" y="167" font-size="10.5" fill="#8B93A1">代理正在按委托链执行交易</text>

    <g>
      <rect x="714" y="184" width="198" height="60" rx="10" fill="#1A1E25" stroke="#262B33"/>
      <text x="728" y="206" font-size="10.5" fill="#8B93A1">待我审批</text>
      <text x="728" y="230" font-size="20" font-weight="700" fill="#F4F1EA">3</text>
      <text x="748" y="230" font-size="10.5" fill="#8B93A1">项</text>

      <rect x="924" y="184" width="198" height="60" rx="10" fill="#1A1E25" stroke="#262B33"/>
      <text x="938" y="206" font-size="10.5" fill="#8B93A1">本月交易额</text>
      <text x="938" y="230" font-size="20" font-weight="700" fill="#F4F1EA">$2,296,000</text>

      <rect x="714" y="254" width="198" height="60" rx="10" fill="#1A1E25" stroke="#262B33"/>
      <text x="728" y="276" font-size="10.5" fill="#8B93A1">委托链健康</text>
      <text x="728" y="300" font-size="20" font-weight="700" fill="#F4F1EA">3/4</text>
      <text x="762" y="300" font-size="10.5" fill="#8B93A1">生效</text>

      <rect x="924" y="254" width="198" height="60" rx="10" fill="#1A1E25" stroke="#262B33"/>
      <text x="938" y="276" font-size="10.5" fill="#8B93A1">待处理案件</text>
      <text x="938" y="300" font-size="20" font-weight="700" fill="#F4F1EA">2</text>
      <text x="958" y="300" font-size="10.5" fill="#8B93A1">个</text>
    </g>

    <!-- mini chart -->
    <text x="714" y="344" font-size="10.5" fill="#8B93A1">近 7 天交易额</text>
    <text x="1116" y="344" font-size="10.5" fill="#8B93A1" text-anchor="end">$1,327,150</text>
    <g>
      <rect x="714" y="384" width="18" height="26" rx="3" fill="#F4F1EA" opacity="0.85"/>
      <rect x="744" y="392" width="18" height="18" rx="3" fill="#F4F1EA" opacity="0.85"/>
      <rect x="774" y="376" width="18" height="34" rx="3" fill="#F4F1EA" opacity="0.85"/>
      <rect x="804" y="400" width="18" height="10" rx="3" fill="#F4F1EA" opacity="0.85"/>
      <rect x="834" y="382" width="18" height="28" rx="3" fill="#F4F1EA" opacity="0.85"/>
      <rect x="864" y="396" width="18" height="14" rx="3" fill="#F4F1EA" opacity="0.85"/>
      <rect x="894" y="366" width="18" height="44" rx="3" fill="#E5B54A"/>
      <rect x="924" y="410" width="198" height="1" fill="#262B33"/>
    </g>
    <text x="714" y="440" font-size="10.5" fill="#6F7784">近 7 天日均 $189,593 · 今日 $390,150</text>
    <text x="714" y="472" font-size="10.5" fill="#8B93A1">体验模式 · 示例工作区</text>
    <rect x="1054" y="452" width="72" height="26" rx="13" fill="#123527" stroke="#1F5C41"/>
    <circle cx="1070" cy="465" r="3.5" fill="#5BE6AC"/>
    <text x="1080" y="469" font-size="11" fill="#7CE8B8">运行正常</text>
  </g>
</svg>
