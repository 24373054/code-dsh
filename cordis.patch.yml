# Trust platform: an embedded identity and payment-trust plane for DSH.
# Everything runs in-process; there is no sidecar service and no listening port.
# Every field below is optional - remove the leading '#' to override a default.
- insert:
    - id: trust-platform-tools
      name: '@sealwax/dsh-trust-platform'
